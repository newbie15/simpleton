<!-- Payment Display HTML Snippet untuk Checkout Modal -->

<!-- Tambahkan di dalam checkout modal, sebelum input fields -->
<div class="payment-display-section">
    <h4 style="margin-top: 0; color: #333; font-size: 18px; border-bottom: 2px solid #007bff; padding-bottom: 10px;">
        Ringkasan Pembayaran
    </h4>

    <!-- Total Tagihan -->
    <div class="payment-display-row">
        <div class="payment-display-label">Total Tagihan:</div>
        <div class="payment-display-value total">
            Rp <span id="payment-total-display">0</span>
        </div>
    </div>

    <!-- Nominal Bayar (untuk metode tunai) -->
    <div class="payment-input-group" id="cash-payment-fields" style="display: none;">
        <label for="nominal-bayar">💰 Nominal Uang Diterima:</label>
        <input type="number" id="nominal-bayar" name="nominal-bayar" placeholder="Masukkan jumlah uang" min="0"
            step="1000">
    </div>

    <!-- Display Kembalian -->
    <div class="payment-display-row" id="cash-payment-fields" style="display: none;">
        <div class="payment-display-label">Kembalian:</div>
        <div class="payment-display-value change">
            Rp <span id="payment-kembalian-display">0</span>
        </div>
    </div>

    <!-- EDC Payment Fields -->
    <div class="payment-input-group" id="edc-payment-fields" style="display: none;">
        <label for="nomor-referensi">🏧 Nomor Referensi / Approval:</label>
        <input type="text" id="nomor-referensi" name="nomor-referensi" placeholder="Masukkan nomor referensi EDC">
    </div>

    <!-- Transfer Payment Fields -->
    <div class="payment-input-group" id="transfer-payment-fields" style="display: none;">
        <label for="bank-tujuan">🏦 Nama Bank Tujuan:</label>
        <input type="text" id="bank-tujuan" name="bank-tujuan" placeholder="Masukkan nama bank tujuan">
    </div>

    <!-- Voucher / Diskon -->
    <div class="payment-input-group">
        <label for="checkout-voucher">🎟️ Kode Voucher (Opsional):</label>
        <input type="text" id="checkout-voucher" name="checkout-voucher" placeholder="Masukkan kode voucher jika ada">
    </div>

    <!-- Payment Method Selection -->
    <div class="payment-input-group">
        <label for="metode_pembayaran">💳 Metode Pembayaran:</label>
        <select id="metode_pembayaran" name="metode_pembayaran" class="form-control"
            style="padding: 10px; font-size: 16px;">
            <option value="tunai">Tunai</option>
            <option value="edc">EDC / Kartu Debit</option>
            <option value="transfer">Transfer Bank</option>
        </select>
    </div>

    <!-- Large Display Summary -->
    <div class="payment-large-display">
        <div class="label">TOTAL PEMBAYARAN</div>
        <div style="font-size: 14px; color: rgba(255,255,255,0.9); margin-bottom: 10px;">Rp</div>
        <div class="value" id="payment-total-large">0</div>
        <div style="font-size: 12px; margin-top: 10px; opacity: 0.85;">
            <span id="payment-status-text">Masukkan nominal pembayaran</span>
        </div>
    </div>
</div>

<!-- Styling inline untuk baris duplikat (diperlukan karena ada 2 elemen dengan id cash-payment-fields) -->
<style>
    #cash-payment-fields:nth-of-type(1) {
        /* Input group version */
    }

    #cash-payment-fields:nth-of-type(2) {
        /* Display row version */
    }
</style>

<!-- 
CATATAN INTEGRASI:
1. Letakkan snippet ini di dalam modal dengan id="checkout-modal"
2. Pastikan CSS dari payment-display.css sudah di-include di halaman
3. JavaScript updatePaymentDisplay() akan otomatis update tampilan saat:
   - User mengubah nilai #nominal-bayar
   - User mengubah nilai #checkout-voucher
   - Modal dibuka via openCheckout()

4. Element IDs yang harus ada:
   - #checkout-modal (parent modal)
   - #metode_pembayaran (payment method selector)
   - #nominal-bayar (cash amount input)
   - #checkout-voucher (voucher code input)
   - #nomor-referensi (EDC reference)
   - #bank-tujuan (transfer bank target)
   - #cash-payment-fields (akan di-toggle berdasarkan metode)
   - #edc-payment-fields (akan di-toggle berdasarkan metode)
   - #transfer-payment-fields (akan di-toggle berdasarkan metode)
   - #payment-total-display (untuk tampilan total Rp)
   - #payment-kembalian-display (untuk tampilan kembalian Rp)

5. Update JavaScript updatePaymentDisplay() jika perlu custom diskon/voucher logic
-->
