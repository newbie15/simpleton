; =====================================================================
; Konfigurasi Backup Otomatis Database Koperasi Simpleton
; =====================================================================

[Database]
DB_NAME = simpleton
DB_USER = root
DB_PASS = 
DB_HOST = localhost
DB_PORT = 3306

[Paths]
; Path ke mysqldump.exe (sesuaikan dengan lokasi instalasi XAMPP)
MYSQLDUMP_PATH = G:\xampp\mysql\bin\mysqldump.exe

; Path ke 7-Zip untuk enkripsi AES-256 (opsional, jika tidak ada akan fallback ke zip biasa)
SEVENZIP_PATH = C:\Program Files\7-Zip\7z.exe

; Direktori penyimpanan file backup
BACKUP_DIR = G:\xampp\htdocs\simpleton\backups

[Security]
; Password untuk mengenkripsi file arsip backup (.7z)
; Ubah password ini menjadi password rahasia koperasi yang kuat!
ARCHIVE_PASSWORD = SimpletonKoperasiBackup2026!

[Retention]
; Jumlah hari penyimpanan backup harian sebelum otomatis dihapus
RETENTION_DAYS = 14
